name: Student CI
on: 
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            - name: setup node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm
            - name: install dependencies
              run: npm ci 
            - name: check server.js
              run: node --check server.js
